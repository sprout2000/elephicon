[package]
name = "elephicon"
version = "5.0.0"
description = "Elephicon generates Apple ICNS and Microsoft ICO files from PNG, SVG and other images."
authors = ["sprout2000"]
license = "MIT"
repository = "https://github.com/sprout2000/elephicon"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "elephicon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
resvg = "0.45"
ico = "0.4"
icns = "0.3"
mime_guess = "2"
sys-locale = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
